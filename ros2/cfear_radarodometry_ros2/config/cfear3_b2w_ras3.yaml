# CFEAR-3 parameters for the b2w_rsl deployment: NavTech RAS-3, published as
# whole-rotation polar images by the leggedrobotics navtech_radar_sdk
# polar_image_publisher on /radar_data/radar_frame (sensor_msgs/Image, mono8,
# rows=azimuths, leading 11 Oxford/Boreas metadata columns per row) with a
# latched navtech_msgs/RadarConfigurationMsg on /radar_data/configuration_data.
# radarsplat_replay's "frames" mode publishes the same interface, so this config
# also works against dataset replay (then prefer stamp_source: header -- the
# replayed metadata carries dataset-era time while /odometry is stamped now()).
#
# radar.* geometry values are only the FALLBACK, used if no configuration
# message arrives within radar.config_timeout_sec. They match the real RAS-3
# (native 1712 bins x 0.040307827 m = 69 m) as cropped by the driver's default
# start_bin 0 / end_bin 497 (~20 m).
# The CFEAR-3 algorithm parameters (driver/fuser/out) are carried over
# unchanged from cfear3_boreas.yaml (Boreas-validated); re-tune once real RAS-3
# trajectories are available.
cfear_odometry_node:
  ros__parameters:
    radar:
      image_topic: /radar_data/radar_frame   # navtech_radar_sdk polar_image_publisher / replay frames
      config_topic: /radar_data/configuration_data
      config_durability: transient_local  # driver publishes the config latched
      config_timeout_sec: 5.0
      metadata_columns: 11              # fallback only; announced in the config msg
      azimuth_samples: 400
      encoder_size: 5600
      range_in_bins: 497                # cropped image width (native 1712 bins = 69 m)
      range_res: 0.040307827            # m/bin (RAS-3 bin size)
      rotation_rate_hz: 4.0
      # The RAS-3 azimuth index runs CLOCKWISE seen from above, i.e. towards
      # NEGATIVE bearings in the REP-103 frame this deployment uses (x fwd, y
      # left, z up). CFEAR's polar->cartesian is hardcoded counter-clockwise, so
      # without this every scan - and therefore the whole trajectory - is
      # reflected about x: y -> -y, yaw -> -yaw. Measured on hg_nav_4: net yaw
      # +50.4 deg against the DLIO reference's -49.30 deg.
      # Boreas needs it OFF: its radar frame is z-down, where the same physical
      # rotation is counter-clockwise. See cfear3_boreas.yaml.
      reverse_azimuths: true
      max_missing_fraction: 0.25        # drop scans missing more azimuths than this
      min_filtered_points: 20
      stamp_source: first_azimuth       # first_azimuth | last_azimuth | now | header

    driver:
      z_min: 60.0
      k_strongest: 40
      min_distance: 2.5
      filter_type: kstrong              # kstrong | CA-CFAR
      publish_filtered: false           # debug: publish filtered cloud as PointCloud2
      filtered_topic: radar_filtered

    fuser:
      cost_type: P2P
      loss_type: Huber
      loss_limit: 0.1
      weight_option: 4
      weight_intensity: true
      res: 3.0
      submap_scan_size: 4
      registered_min_keyframe_dist: 1.5
      min_keyframe_rot_deg: 5.0
      use_keyframe: true
      use_guess: true
      compensate: true
      # Deskew direction, and ONLY that - it cannot mirror anything (both values
      # give the same rotation sign; that is radar.reverse_azimuths' job). It
      # must match reverse_azimuths: the row reversal flips how acquisition time
      # maps to bearing, and Compensate() reads the time back out of the bearing.
      # Confirmed on hg_nav_4, where the pairing is worth 4.2 m of path length
      # (26.84 m vs 31.06 m against a 28.04 m reference).
      radar_ccw: true
      covar_scale: 1.0
      regularization: 0.0
      soft_constraint: false
      disable_registration: false
      downsample_factor: 1.0
      store_graph: false

    out:
      odom_topic: /cfear/odometry       # NOT /odometry: fognav_replay also publishes there
                                        # (from dataset ground truth) - never run both at once
      odom_keyframe_topic: /cfear/odometry_keyframe
      registered_cloud_topic: radar_registered
      registered_keyframe_cloud_topic: radar_registered_keyframe
      # false: the registered cloud is visualization only and nothing in this
      # deployment subscribes to it (the upstream rviz configs name a topic this
      # node does not even publish). Measured at 0.35 MB per scan, republished a
      # second time on every keyframe, and the transform + PCL->ROS serialization
      # + DDS publish all happen inline in processFrame - i.e. inside the
      # per-scan cost. It cannot affect the estimate: FormatScanMsg works on a
      # copy that never feeds back. Set true to debug in rviz.
      publish_registered_cloud: false
      # Broadcasts cfear_odom -> base (see frames.tf_body_frame). Safe next to
      # DLIO, which parents dlio_odom UNDER base rather than the other way
      # round, so base keeps exactly one parent. Turn this off if some other
      # source starts publishing a parent for base - two parents make every tf2
      # lookup depend on arrival order.
      publish_tf: true

    frames:
      # Not "odom": bievr-lio already publishes an odom frame, and DLIO names its
      # own dlio_odom for the same reason. rviz fixed frame for a CFEAR run.
      odom_frame: cfear_odom
      radar_frame: radar_link
      # Broadcast cfear_odom -> base rather than cfear_odom -> radar_link. The
      # navtech_radar container owns radar_link already (static lidar ->
      # radar_link), and a frame with two parents makes every tf2 lookup - rviz,
      # "2D Goal Pose", the nav stack - depend on arrival order. The node
      # composes the estimate with radar_link <- base from tf2; the odometry
      # topic still carries the radar pose, which is what radarsplat wants.
      tf_body_frame: base
