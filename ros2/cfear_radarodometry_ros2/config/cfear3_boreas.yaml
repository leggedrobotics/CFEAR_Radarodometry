# CFEAR-3 parameters (best accuracy), tuned for a Boreas-like Navtech CIR204-H:
# same values as the ROS1 offline pipeline in docker/run_boreas.sh.
# Input is whole-rotation polar frames on /radar_data/radar_frame; replay a
# Boreas sequence with radarsplat_replay's "frames" mode (or run the pipeline
# straight off the PNGs with offline_png_test).
# radar.* geometry values are only the FALLBACK - the driver's
# RadarConfigurationMsg overrides them when it arrives.
cfear_odometry_node:
  ros__parameters:
    radar:
      image_topic: /radar_data/radar_frame
      config_topic: /radar_data/configuration_data
      config_durability: transient_local
      config_timeout_sec: 5.0
      metadata_columns: 11              # fallback only; announced in the config msg
      azimuth_samples: 400
      encoder_size: 5600
      range_in_bins: 3768
      range_res: 0.0596                 # m/bin; CIR204-H (Oxford CTS350-X: 0.0438)
      rotation_rate_hz: 4.0
      # OFF for Boreas/Oxford: their radar frame is z-down, so the sensor's
      # physical clockwise rotation is counter-clockwise there and CFEAR's
      # hardcoded counter-clockwise polar->cartesian is already right. Only a
      # sensor read in a REP-103 z-UP frame needs the reversal (see
      # cfear3_b2w_ras3.yaml).
      reverse_azimuths: false
      max_missing_fraction: 0.25        # drop scans missing more azimuths than this
      min_filtered_points: 20
      stamp_source: first_azimuth       # first_azimuth | last_azimuth | now | header

    driver:
      z_min: 60.0
      k_strongest: 40
      min_distance: 2.5
      filter_type: kstrong              # kstrong | CA-CFAR
      publish_filtered: false           # debug: publish filtered cloud as PointCloud2
      filtered_topic: radar_filtered

    fuser:
      cost_type: P2P
      loss_type: Huber
      loss_limit: 0.1
      weight_option: 4
      weight_intensity: true
      res: 3.0
      submap_scan_size: 4
      registered_min_keyframe_dist: 1.5
      min_keyframe_rot_deg: 5.0
      use_keyframe: true
      use_guess: true
      compensate: true
      # false, matching this preset's stated source of truth: docker/run_boreas.sh
      # passes --radar_ccw false (its comment above the call says "true" and is
      # what this file previously copied - the flag, not the comment, is what was
      # validated), and every upstream oxford_cfear-* preset is false too.
      # Consistent with the mechanism: bearing grows with acquisition time here,
      # which is the (d-0.5) branch of GetRelTimeStamp. Deskew only - it cannot
      # mirror the trajectory; that is radar.reverse_azimuths' job.
      radar_ccw: false
      covar_scale: 1.0
      regularization: 0.0
      soft_constraint: false
      disable_registration: false
      downsample_factor: 1.0
      store_graph: false

    out:
      odom_topic: /odometry
      odom_keyframe_topic: /odometry_keyframe
      registered_cloud_topic: radar_registered
      registered_keyframe_cloud_topic: radar_registered_keyframe
      publish_registered_cloud: true
      publish_tf: true

    frames:
      odom_frame: odom
      radar_frame: radar_link
